name: Qualify actual portable version recipe

on:
  workflow_dispatch:
    inputs:
      case:
        description: Reviewed immutable source recipe
        type: choice
        default: plugins-changesets2
        options:
          - plugins-changesets2
          - core-changesets3
          - mira-changesets3
          - tasks-changesets3
          - tasks-readiness-changesets3
          - docs-changesets3
          - docs-readiness-changesets3
          - terminal-changesets2-native
          - ai-changesets2-native
          - agent-ui-changesets2

permissions:
  contents: read

concurrency:
  group: source-version-recipe-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ (inputs.case == 'ai-changesets2-native' || inputs.case == 'terminal-changesets2-native') && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: guard
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - name: Select reviewed immutable recipe coordinates
        id: recipe
        run: node guard/scripts/select-version-recipe.mjs
        env:
          RECIPE_CASE: ${{ inputs.case }}
      - name: Select the reviewed AI Node22 runtime
        if: steps.recipe.outputs.profile == 'ai-node22-rust-offline'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.recipe.outputs.node }}
      - name: Install the source-owned native Rust toolchain
        if: steps.recipe.outputs.profile == 'ai-node22-rust-offline' || steps.recipe.outputs.profile == 'terminal-node24-rust-offline'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.recipe.outputs.repository }}
          ref: ${{ steps.recipe.outputs.source }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Activate the source-owned exact package manager
        run: corepack enable && corepack prepare "$RECIPE_PNPM" --activate
        env:
          RECIPE_PNPM: ${{ steps.recipe.outputs.pnpm }}
      - name: Qualify genuine source version mutation without Deno or a writer App
        if: steps.recipe.outputs.profile != 'ai-node22-rust-offline' && steps.recipe.outputs.profile != 'terminal-node24-rust-offline'
        run: node guard/scripts/qualify-version-recipe.mjs consumer
        env:
          RECIPE_CASE: ${{ steps.recipe.outputs.case }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Qualify the genuine AI native recipe without credentials
        if: steps.recipe.outputs.profile == 'ai-node22-rust-offline'
        run: node guard/scripts/qualify-version-recipe.mjs consumer
        env:
          RECIPE_CASE: ${{ steps.recipe.outputs.case }}
      - name: Qualify the genuine Terminal native recipe without credentials
        if: steps.recipe.outputs.profile == 'terminal-node24-rust-offline'
        run: node guard/scripts/qualify-version-recipe.mjs consumer
        env:
          RECIPE_CASE: ${{ steps.recipe.outputs.case }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ steps.recipe.outputs.case }}-runtime-qualification
          path: reports/version-recipe-qualification.json
          if-no-files-found: error
          retention-days: 14
