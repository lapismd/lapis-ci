name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lapis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - uses: docker/setup-buildx-action@v4
      - name: Check repository contract
        run: pnpm verify
      - name: Qualify the existing npm12 publisher profile without changing global tools
        run: node scripts/qualify-registry-npm12.mjs
      - name: Build native candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: lapismd/lapis-ci:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Verify candidate image
        run: >-
          docker run --rm lapismd/lapis-ci:candidate
          node /usr/local/share/lapis-ci/verify-image.mjs

  host-gh-darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
      - name: Require native Darwin ARM64
        run: node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform,"darwin"); assert.equal(process.arch,"arm64");'
      - uses: ./actions/setup-gh
      - name: Qualify the shared owned CLI and attestation ABI
        run: node scripts/verify-host-gh.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: host-gh-darwin-arm64
          path: reports/host-gh-darwin-arm64.json
          if-no-files-found: error
          retention-days: 14
